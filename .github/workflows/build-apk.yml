name: Build PrivateChat AI APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Recover project ZIP
        run: |
          unzip -q "$GITHUB_WORKSPACE/PrivateChatAI.zip" -d /tmp/extracted_project

      - name: Build with Gradle
        run: |
          cd /tmp/extracted_project/mnt/data/PrivateChatAI
          
          if [ ! -f "gradlew" ]; then
            gradle wrapper
          fi
          
          chmod +x gradlew
          ./gradlew :android:app:assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: privatechat-ai-debug-apk
          path: /tmp/extracted_project/mnt/data/PrivateChatAI/android/app/build/outputs/apk/debug/app-debug.apk

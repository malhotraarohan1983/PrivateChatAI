name: Build PrivateChat AI APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Setup Java environment required to build Android apps
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 2. Unzip locally instead of using curl over the network
      - name: Recover project ZIP
        run: |
          unzip -q "$GITHUB_WORKSPACE/PrivateChatAI.zip" -d /tmp/privatechatai

      # 3. Locate the actual project paths dynamically
      - name: Inject Gradle Packaging Fix
        run: |
          # Dynamically look for where build.gradle.kts exists in the unzipped folder
          GRADLE_FILE=$(find /tmp/privatechatai -name "build.gradle.kts" | grep "android/app" | head -n 1)
          ROOT_GRADLE=$(find /tmp/privatechatai -maxdepth 4 -name "build.gradle.kts" | grep -v "android/" | head -n 1)
          
          # Inject Compose dependencies if needed
          if [ -f "$ROOT_GRADLE" ]; then
            sed -i '/id("org.jetbrains.kotlin.plugin.serialization") version "2.0.21" apply false/a\    id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false' "$ROOT_GRADLE"
          fi
          
          if [ -f "$GRADLE_FILE" ]; then
            sed -i '/id("org.jetbrains.kotlin.android")/a\    id("org.jetbrains.kotlin.plugin.compose")' "$GRADLE_FILE"
            sed -i '/io\.ktor:ktor-client-sse/d' "$GRADLE_FILE"
            
            # Append the packaging configurations block directly into it
            cat << 'EOF' >> "$GRADLE_FILE"

          android {
              packaging {
                  resources {
                      excludes += "/META-INF/DEPENDENCIES"
                      excludes += "/META-INF/LICENSE"
                      excludes += "/META-INF/LICENSE.txt"
                      excludes += "/META-INF/NOTICE"
                      excludes += "/META-INF/NOTICE.txt"
                  }
              }
          }
          EOF
          fi

      # 4. Find gradlew, mark it executable, and run compilation
      - name: Build with Gradle
        run: |
          # Fixed the pipe structure here to avoid the find error
          GRADLEW_PATH=$(find /tmp/privatechatai -name "gradlew" | head -n 1)
          ANDROID_DIR=$(dirname "$GRADLEW_PATH")
          
          cd "$ANDROID_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      # 5. Find the compiled APK and upload it
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: privatechat-ai-debug-apk
          path: /tmp/privatechatai/**/build/outputs/apk/debug/app-debug.apk

name: Build PrivateChat AI APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Provide the proper JDK environment required for compilation
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 2. Extract the ZIP locally to a flattened workspace folder
      - name: Recover project ZIP
        run: |
          unzip -q "$GITHUB_WORKSPACE/PrivateChatAI.zip" -d /tmp/extracted_project

      # 3. Completely rewrite the configuration files from scratch to guarantee it is 100% correct
      - name: Inject Flawless Project Configuration
        run: |
          # 1. Dynamically locate the project directories inside the unzipped folder
          SETTINGS_PATH=$(find /tmp/extracted_project -name "settings.gradle.kts" | head -n 1)
          PROJECT_ROOT=$(dirname "$SETTINGS_PATH")
          APP_DIR="$PROJECT_ROOT/android/app"

          # 2. Completely overwrite settings.gradle.kts with the correct text
          cat << 'EOF' > "$PROJECT_ROOT/settings.gradle.kts"
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
              plugins {
                  id("org.jetbrains.kotlin.plugin.compose") version "2.0.21"
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_PROJECT)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "PrivateChatAI"
          include(":android:app")
          EOF

          # 3. Completely overwrite the root build.gradle.kts with the correct text
          cat << 'EOF' > "$PROJECT_ROOT/build.gradle.kts"
          plugins {
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.serialization") version "2.0.21" apply false
              id("com.google.devtools.ksp") version "2.0.21-1.0.28" apply false
          }
          EOF

          # 4. Overwrite the app-level build.gradle.kts with clean dependencies and the resource shield
          cat << 'EOF' > "$APP_DIR/build.gradle.kts"
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.serialization")
              id("com.google.devtools.ksp")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "com.privatechatai"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.privatechatai"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              buildFeatures {
                  compose = true
              }

              packaging {
                  resources {
                      excludes += "META-INF/**"
                      excludes += "/META-INF/**"
                      excludes += "**/META-INF/**"
                  }
              }
          }

          dependencies {
              // Core Android & Jetpack Compose bindings
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.7.0")
              implementation("androidx.activity:activity-compose:1.8.2")
              platform("androidx.compose:compose-bom:2024.02.00")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")

              // Ktor Network streaming modules explicitly aligned to stable 2.3.12 versions
              implementation("io.ktor:ktor-client-core:2.3.12")
              implementation("io.ktor:ktor-client-cio:2.3.12")
              implementation("io.ktor:ktor-client-content-negotiation:2.3.12")
              implementation("io.ktor:ktor-serialization-kotlinx-json:2.3.12")
              implementation("io.ktor:ktor-client-sse:2.3.12")
          }

          tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
              kotlinOptions {
                  freeCompilerArgs += listOf(
                      "-opt-in=androidx.compose.material3.ExperimentalMaterial3Api",
                      "-opt-in=androidx.compose.material.ExperimentalMaterialApi"
                  )
              }
          }
          EOF

      # 4. Compile the app using the newly injected clean files
      - name: Build with Gradle
        run: |
          SETTINGS_PATH=$(find /tmp/extracted_project -name "settings.gradle.kts" | head -n 1)
          PROJECT_ROOT=$(dirname "$SETTINGS_PATH")
          
          cd "$PROJECT_ROOT"
          
          if [ ! -f "gradlew" ]; then
            gradle wrapper
          fi
          
          chmod +x gradlew
          ./gradlew :android:app:assembleDebug

      # 5. Export the finished app file out to your summary screen
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: privatechat-ai-debug-apk
          path: /tmp/extracted_project/**/build/outputs/apk/debug/app-debug.apk

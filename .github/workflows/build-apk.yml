name: Build PrivateChat AI APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Setup Java environment required to build Android apps
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 2. Recover the project ZIP using the correct wrapped URL address
      - name: Recover project ZIP
        run: |
          curl -fL "https://githubusercontent.com" -o PrivateChatAI.zip
          unzip -q PrivateChatAI.zip -d /tmp/privatechatai

      - name: Verify project
        run: |
          PROJECT="/tmp/privatechatai/mnt/data/PrivateChatAI"
          test -f "$PROJECT/settings.gradle.kts"
          test -f "$PROJECT/android/app/build.gradle.kts"
          test -f "$PROJECT/android/app/src/main/java/com/privatechatai/MainActivity.kt"

      - name: Fix project
        run: |
          PROJECT="/tmp/privatechatai/mnt/data/PrivateChatAI"

          sed -i '/id("org.jetbrains.kotlin.plugin.serialization") version "2.0.21" apply false/a\    id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false' "$PROJECT/build.gradle.kts"

          sed -i '/id("org.jetbrains.kotlin.android")/a\    id("org.jetbrains.kotlin.plugin.compose")' "$PROJECT/android/app/build.gradle.kts"

          sed -i '/io\.ktor:ktor-client-sse/d' "$PROJECT/android/app/build.gradle.kts"

      # 3. Inject the packaging block required to fix the duplicate resource error
      - name: Inject Gradle Packaging Fix
        run: |
          PROJECT="/tmp/privatechatai/mnt/data/PrivateChatAI"
          
          cat << 'EOF' >> "$PROJECT/android/app/build.gradle.kts"

          android {
              packaging {
                  resources {
                      excludes += "/META-INF/DEPENDENCIES"
                      excludes += "/META-INF/LICENSE"
                      excludes += "/META-INF/LICENSE.txt"
                      excludes += "/META-INF/NOTICE"
                      excludes += "/META-INF/NOTICE.txt"
                  }
              }
          }
          EOF

      # 4. Grant execution permissions and run the compilation command
      - name: Build with Gradle
        run: |
          PROJECT="/tmp/privatechatai/mnt/data/PrivateChatAI"
          cd "$PROJECT/android"
          chmod +x gradlew
          ./gradlew assembleDebug

      # 5. Upload the compiled file so it becomes available in your Artifacts tab
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: privatechat-ai-debug-apk
          path: /tmp/privatechatai/mnt/data/PrivateChatAI/android/app/build/outputs/apk/debug/app-debug.apk

name: Build PrivateChat AI APK

on:
  workflow_dispatch:

  jobs:
    build:
        runs-on: ubuntu-latest

            steps:
                  - name: Checkout repository
                          uses: actions/checkout@v4

                                - name: Extract project
                                        run: |
                                                  mkdir -p /tmp/privatechatai
                                                            unzip -q PrivateChatAI.zip -d /tmp/privatechatai

                                                                  - name: Set up Java
                                                                          uses: actions/setup-java@v4
                                                                                  with:
                                                                                            distribution: temurin
                                                                                                      java-version: '17'

                                                                                                            - name: Set up Gradle
                                                                                                                    uses: gradle/actions/setup-gradle@v4
                                                                                                                            with:
                                                                                                                                      gradle-version: '8.10.2'

                                                                                                                                            - name: Build APK
                                                                                                                                                    working-directory: /tmp/privatechatai/mnt/data/PrivateChatAI
                                                                                                                                                            run: gradle :android:app:assembleDebug --no-daemon

                                                                                                                                                                  - name: Upload APK
                                                                                                                                                                          uses: actions/upload-artifact@v4
                                                                                                                                                                                  with:
                                                                                                                                                                                            name: PrivateChatAI-debug
                                                                                                                                                                                                      path: /tmp/privatechatai/mnt/data/PrivateChatAI/android/app/build/outputs/apk/debug/app-debug.apk
name: Build PrivateChat AI APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir -p /tmp/privatechatai
          unzip -q PrivateChatAI.zip -d /tmp/privatechatai

      - name: Fix Compose Compiler and Ktor configuration
        run: |
          PROJECT="/tmp/privatechatai/mnt/data/PrivateChatAI"

          sed -i '/id("org.jetbrains.kotlin.plugin.serialization") version "2.0.21" apply false/a\    id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false' "$PROJECT/build.gradle.kts"

          sed -i '/id("org.jetbrains.kotlin.android")/a\    id("org.jetbrains.kotlin.plugin.compose")' "$PROJECT/android/app/build.gradle.kts"

          sed -i '/io\.ktor:ktor-client-sse/d' "$PROJECT/android/app/build.gradle.kts"
          sed -i 's/onDelta:(String)->Unit/onDelta:suspend (String)->Unit/' "$PROJECT/android/app/src/main/java/com/privatechatai/network/Api.kt"
sed -i 's/\.let(onDelta)/.let{onDelta(it)}/' "$PROJECT/android/app/src/main/java/com/privatechatai/network/Api.kt"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        working-directory: /tmp/privatechatai/mnt/data/PrivateChatAI
        run: gradle :android:app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PrivateChatAI-debug
          path: /tmp/privatechatai/mnt/data/PrivateChatAI/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Build APK
        working-directory: /tmp/privatechatai/mnt/data/PrivateChatAI
        run: gradle :android:app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PrivateChatAI-debug
          path: /tmp/privatechatai/mnt/data/PrivateChatAI/android/app/build/outputs/apk/debug/app-debug.apk

name: Build PrivateChat AI APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Provide the proper JDK environment required for compilation
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 2. Extract the ZIP locally to a flattened workspace folder
      - name: Recover project ZIP
        run: |
          unzip -q "$GITHUB_WORKSPACE/PrivateChatAI.zip" -d /tmp/extracted_project

      # 3. Apply all gradle file fixes in the direct target paths
      - name: Inject Configuration and Fixes
        run: |
          # Define the target paths explicitly based on the internal ZIP structures
          ROOT_GRADLE="/tmp/extracted_project/mnt/data/PrivateChatAI/build.gradle.kts"
          APP_GRADLE="/tmp/extracted_project/mnt/data/PrivateChatAI/android/app/build.gradle.kts"

          # Fix the root build file dependencies
          if [ -f "$ROOT_GRADLE" ]; then
            sed -i '/id("org.jetbrains.kotlin.plugin.serialization") version "2.0.21" apply false/a\    id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false' "$ROOT_GRADLE"
          fi

          # Fix the app build file dependencies and strip problem plugins
          if [ -f "$APP_GRADLE" ]; then
            sed -i '/id("org.jetbrains.kotlin.android")/a\    id("org.jetbrains.kotlin.plugin.compose")' "$APP_GRADLE"
            sed -i '/io\.ktor:ktor-client-sse/d' "$APP_GRADLE"
            
            # Inject the packaging blocks to suppress the META-INF duplicate failures
            cat << 'EOF' >> "$APP_GRADLE"

          android {
              packaging {
                  resources {
                      excludes += "/META-INF/DEPENDENCIES"
                      excludes += "/META-INF/LICENSE"
                      excludes += "/META-INF/LICENSE.txt"
                      excludes += "/META-INF/NOTICE"
                      excludes += "/META-INF/NOTICE.txt"
                  }
              }
          }
          EOF
          fi

      # 4. Stay inside the master project root folder for both the wrapper setup AND compilation
      - name: Build with Gradle
        run: |
          cd /tmp/extracted_project/mnt/data/PrivateChatAI
          
          # Initialize the wrapper execution keys from the root
          if [ ! -f "gradlew" ]; then
            echo "Local execution wrapper was not packaged. Re-generating gradlew from project root..."
            gradle wrapper
          fi
          
          # Execute the compilation directly from the root targeting the app module
          chmod +x gradlew
          ./gradlew :android:app:assembleDebug

      # 5. Safe wildcard export path to pull the final debug build file out
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: privatechat-ai-debug-apk
          path: /tmp/extracted_project/mnt/data/PrivateChatAI/android/app/build/outputs/apk/debug/app-debug.apk
